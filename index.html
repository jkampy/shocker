<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shocker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arena scoreboard, punchy but tidy; it's for friends, not a corporation
   IDEA: the big hanging scoreboard over a hardwood floor
   PICTURE: the standings board itself, lit numbers on a dark board, sitting on a maple court band
   COLOUR and TYPE: maple #d9a066 floor, scoreboard ink #15171c, ball orange #f26b1d accent; Oswald numbers, Barlow text
   LAYOUT: modest title, standings board first, rosters expand inline, commissioner tools below */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f9,#0a1322);--ink:light-dark(#13294B,#eef2f8);--mute:light-dark(#4e5d75,#9fb0c8);
--floor:#ffffff;--floor2:#fff0e6;
--board:#0e1f3b;--board2:#162d52;--lit:#FF5F05;--orange:#FF5F05;--line:light-dark(#dde3ec,#22375a);--card:light-dark(#ffffff,#10203a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
header.band{background:repeating-linear-gradient(90deg,var(--floor) 0 46px,var(--floor2) 46px 48px);padding-bottom:clamp(116px,12vw,140px);position:relative}
header.band{border-bottom:8px solid #FF5F05}header.band::after{content:"";position:absolute;left:50%;bottom:-1px;width:min(520px,80vw);height:60px;transform:translateX(-50%);border:3px solid rgba(255,95,5,.55);border-bottom:0;border-radius:260px 260px 0 0}
h1{font:700 clamp(32px,6vw,52px)/1.05 Oswald,sans-serif;margin:0;color:#FF5F05;text-wrap:balance}
.sub{margin:6px 0 0;color:#d94f00;font-weight:700}
:root[data-theme=dark] h1,:root[data-theme=dark] .sub{color:#FF5F05}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) h1,:root:not([data-theme=light]) .sub{color:#FF5F05}}
main.band{padding-top:0}
.board{background:var(--board);color:#e9e6df;border-radius:14px;margin-top:-84px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.board-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #22375a}
.board-top h2{font:500 22px/1.1 Oswald,sans-serif;margin:0;color:var(--lit);letter-spacing:.02em}
.note{font-size:13px;color:#a7a39b}
.search{flex:1 1 220px;max-width:320px}
input,button{font:inherit;font-size:16px}
input[type=search],input[type=text],input[type=number]{width:100%;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid #2b4570;background:var(--board2);color:#f1ece4}
input:focus-visible,button:focus-visible,.row:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 64px 52px 52px 64px 56px 24px;align-items:center;gap:6px;padding:10px 18px;border-bottom:1px solid #1d3355;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;text-align:left;min-height:56px}
.row:hover{background:#142a4d}
.head{cursor:default;min-height:0;font-size:13px;color:#a7a39b;padding-block:8px}.head:hover{background:none}
.rk{font:700 22px Oswald,sans-serif;color:#8d8a84}
.r1 .rk{color:var(--lit)}
.nm{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:500 24px Oswald,sans-serif;text-align:right;color:var(--lit);font-variant-numeric:tabular-nums;white-space:nowrap}
.num.l{color:#e9e6df}.num.sm{font-size:18px;color:#c9c5bd}
.head .num{font:600 13px Barlow,sans-serif;color:#a7a39b}
.chev{color:#8d8a84;transition:transform .2s}
.row[aria-expanded=true] .chev{transform:rotate(90deg)}
.bar{grid-column:2/-1;height:5px;border-radius:3px;background:#22375a;overflow:hidden;margin-top:-2px}
.bar i{display:block;height:100%;background:var(--orange)}
.roster{background:var(--card);color:var(--ink);padding:14px 18px 18px;border-bottom:1px solid #262930}
.roster table{width:100%;border-collapse:collapse}
.roster th{font-size:13px;color:var(--mute);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.roster td{padding:8px;border-bottom:1px solid var(--line)}
.roster .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.roster th.n{text-align:right}
.roster tr.hit td{background:color-mix(in srgb,var(--orange) 18%,transparent)}
.roster input{background:var(--bg);color:var(--ink);border-color:var(--line);min-height:40px}
.roster input[type=number]{width:72px;text-align:right}
.tot td{font-weight:700;border-bottom:0}
.hist table{width:100%;border-collapse:collapse;margin-top:6px}.hist th,.hist td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}.hist th{font-size:13px;color:var(--mute);font-weight:600}.hist .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.hist details{border-top:1px solid var(--line);padding:6px 0}.hist summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px;font-weight:700}.hist summary b{font:500 20px Oswald,sans-serif;color:var(--orange)}
.empty{padding:24px 18px;color:#a7a39b}
.tools{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tools h3{font:500 20px Oswald,sans-serif;margin:0 0 6px}
.tools p{margin:0 0 12px;color:var(--mute);max-width:68ch}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--ink);background:none;color:var(--ink);font-weight:700;cursor:pointer}
.btn.go{background:var(--orange);border-color:var(--orange);color:#1a1208}
.msg{min-height:1.5em;margin-top:10px;font-weight:600}
.edit-only{display:none}body.editing .edit-only{display:block}
footer{font-size:13px;color:var(--mute);text-align:center;padding:24px 16px 40px}
@media(max-width:600px){.row{grid-template-columns:30px minmax(0,1fr) 50px 40px 40px 18px;padding-inline:12px}.row .gb,.row .pc{display:none}.hist td.pc,.hist th.pc{display:none}.num{font-size:20px}.nm{font-size:16px}.roster{padding-inline:12px}.roster .gp{display:none}}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
<h1 id="title">Shocker</h1>
<p class="sub" id="sub">11 managers · 12 college teams each · most points (wins + bonus) takes it</p>
</div></header>

<main class="band"><div class="wrap">
<section class="board" aria-labelledby="st">
<div class="board-top">
<div><h2 id="st">Standings</h2><div class="note" id="updated"></div></div>
<div class="search"><label class="note" for="q">Find a team</label><input id="q" type="search" placeholder="e.g. Duke" autocomplete="off"></div>
</div>
<div class="row head" aria-hidden="true"><span>#</span><span>Manager</span><span class="num">Pts</span><span class="num">W</span><span class="num">L</span><span class="num pc">Pct</span><span class="num gb">Back</span><span></span></div>
<div id="rows"></div>
</section>
<p class="note" id="samplenote" style="color:var(--mute);margin-top:10px"></p>

<section class="tools hist" aria-labelledby="ht">
<h3 id="ht">Past seasons</h3>
<p>Final standings from the league spreadsheet. Points are wins plus bonus.</p>
<div id="history"></div>
</section>


</div></main>
<footer>Points = wins + bonus. Fewer losses breaks a tie. “Back” is points behind first place.</footer>

<script>
{
const ORIG=JSON.parse(document.getElementById('league-data').textContent);
let data=structuredClone(ORIG),editing=false,open=new Set(),q='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const int=v=>Math.max(0,parseInt(v,10)||0);
const pct=(w,l)=>w+l?(w/(w+l)).toFixed(3).replace(/^0/,''):'.000';
const fmtDate=s=>{const tm=String(s).includes('T');const d=new Date(tm?s:s+'T12:00:00');if(isNaN(d))return s;const day=d.toLocaleDateString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',year:'numeric'});return tm?day+', '+d.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})+' ET':day};
function totals(m){let w=0,l=0,b=0;for(const t of m.teams){w+=int(t.w);l+=int(t.l);b+=int(t.b)}return{w,l,b,p:w+b}}
function ranked(){
  const list=data.managers.map((m,i)=>({m,i,...totals(m)}));
  list.sort((a,b)=>b.p-a.p||a.l-b.l||a.m.name.localeCompare(b.m.name));
  let r=0;list.forEach((x,k)=>{if(k===0||x.p!==list[k-1].p||x.l!==list[k-1].l)r=k+1;x.rank=r});
  return list;
}
function render(){
  $('title').textContent=data.league;document.title=data.league;
  $('sub').textContent=`${data.managers.length} managers · ${data.season} season · most points (wins + bonus) takes it`;
  $('updated').textContent='Last updated '+fmtDate(data.updated)+(data.source?' · source: '+data.source:'');
  $('samplenote').textContent=data.sample?'Sample data shown: placeholder managers and made-up records until the real picks are loaded.':'';
  const list=ranked(),top=list.length?list[0].p:0,ql=q.trim().toLowerCase();
  const shown=ql?list.filter(x=>x.m.teams.some(t=>t.name.toLowerCase().includes(ql))||x.m.name.toLowerCase().includes(ql)):list;
  if(!shown.length){$('rows').innerHTML=`<div class="empty">Nobody has a team matching “${esc(q)}”.</div>`;return}
  $('rows').innerHTML=shown.map(x=>{
    const isOpen=open.has(x.i)||(ql&&x.m.teams.some(t=>t.name.toLowerCase().includes(ql)));
    const w=top?Math.round(x.p/top*100):0;
    const teams=[...x.m.teams.map((t,j)=>({...t,j}))].sort((a,b)=>editing?0:(int(b.w)+int(b.b))-(int(a.w)+int(a.b))||int(a.l)-int(b.l));
    const body=teams.map(t=>{
      const hit=ql&&t.name.toLowerCase().includes(ql)?' class="hit"':'';
      return editing
      ?`<tr><td><input type="text" aria-label="Team name" value="${esc(t.name)}" data-m="${x.i}" data-t="${t.j}" data-f="name"></td>${['w','l','b'].map(f=>`<td class="n"><input type="number" min="0" inputmode="numeric" aria-label="${esc(t.name)} ${f==='w'?'wins':f==='l'?'losses':'bonus'}" value="${int(t[f])}" data-m="${x.i}" data-t="${t.j}" data-f="${f}"></td>`).join('')}</tr>`
      :`<tr${hit}><td>${esc(t.name)}</td><td class="n">${int(t.w)}</td><td class="n">${int(t.l)}</td><td class="n">${int(t.b)||'–'}</td></tr>`}).join('');
    const nameRow=editing?`<p style="margin:0 0 10px"><label class="note" style="color:var(--mute)">Manager name<input type="text" value="${esc(x.m.name)}" data-m="${x.i}" data-f="mname"></label></p>`:'';
    return `<button class="row${x.rank===1?' r1':''}" type="button" aria-expanded="${isOpen}" data-i="${x.i}">
<span class="rk">${x.rank}</span><span class="nm">${esc(x.m.name)}</span><span class="num">${x.p}</span><span class="num l sm">${x.w}</span><span class="num l sm">${x.l}</span><span class="num sm pc">${pct(x.w,x.l)}</span><span class="num sm gb">${top-x.p||'–'}</span><span class="chev" aria-hidden="true">›</span>
<span class="bar" aria-hidden="true"><i style="width:${w}%"></i></span></button>`+
    (isOpen?`<div class="roster">${nameRow}<table><thead><tr><th>Team</th><th class="n">W</th><th class="n">L</th><th class="n">Bonus</th></tr></thead><tbody>${body}<tr class="tot"><td>Total · ${x.p} pts</td><td class="n">${x.w}</td><td class="n">${x.l}</td><td class="n">${x.b}</td></tr></tbody></table></div>`:'');
  }).join('');
}
function renderHist(){
  const h=data.history||[];
  $('history').innerHTML=h.map((s,k)=>`<details${k===0?' open':''}><summary><b>${esc(s.season)}</b><span>Champion: ${esc(s.rows[0]?.name||'')}${s.rows[0]?' · '+esc(s.rows[0].pts)+' pts':''}</span></summary>
<table><thead><tr><th>#</th><th>Manager</th><th class="n">Pts</th><th class="n pc">Win %</th><th class="n">Payout</th></tr></thead><tbody>${s.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td class="n">${esc(r.pts)}</td><td class="n pc">${r.pct!=null?esc(r.pct)+'%':'–'}</td><td class="n">${r.pay?'$'+esc(r.pay):''}</td></tr>`).join('')}</tbody></table></details>`).join('');
}
$('rows').addEventListener('click',e=>{
  const r=e.target.closest('.row');if(!r||r.classList.contains('head'))return;
  const i=+r.dataset.i;open.has(i)?open.delete(i):open.add(i);render();
  const again=document.querySelector(`.row[data-i="${i}"]`);if(again)again.focus();
});

$('q').addEventListener('input',e=>{q=e.target.value;render()});
render();renderHist();
}
</script>
